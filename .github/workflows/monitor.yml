name: 亚马逊竞品监控

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制执行一次（忽略 4 小时门控）"
        type: boolean
        default: false
      test_email:
        description: "只发测试通知（不取数）"
        type: boolean
        default: false

concurrency:
  group: competitor-monitor-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 卖家精灵 MCP V2 巡检
        env:
          SELLERSPRITE_MCP_SECRET_KEY: ${{ secrets.SELLERSPRITE_MCP_SECRET_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TEST_EMAIL_ONLY: ${{ inputs.test_email == true && '1' || '0' }}
          FORCE: ${{ inputs.force == true && '1' || '0' }}
        run: |
          if [ "$TEST_EMAIL_ONLY" = "1" ]; then
            TEST_EMAIL=1 python monitor.py
          elif [ "$FORCE" = "1" ]; then
            python monitor.py
          else
            SCHEDULED_MODE=1 python monitor.py
          fi

      - name: 持久化卖家精灵基线
        if: always() && hashFiles('data/.ran') != ''
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          for file in data/sellersprite_history.json data/sellersprite_last_run.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新卖家精灵监控基线"
            git push
          fi
