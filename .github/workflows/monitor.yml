name: 亚马逊竞品监控

on:
  schedule:
    # 每 6 小时运行一次（UTC 时间）
    - cron: "0 */6 * * *"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 允许提交历史快照回仓库

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 运行监控脚本
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python monitor.py

      - name: 提交历史快照
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/history.json data/monitor.log data/alerts.jsonl 2>/dev/null || true
          git commit -m "chore: 更新监控历史快照 $(date -u +'%Y-%m-%d %H:%M:%S UTC')" 2>/dev/null || echo "无变更"
          git push 2>/dev/null || echo "推送失败（可能无变更或无权限）"
