name: 亚马逊竞品监控

on:
  schedule:
    # 每 6 小时运行一次（UTC 时间）
    - cron: "0 */6 * * *"
  workflow_dispatch: # 允许手动触发
    inputs:
      test_email:
        description: "只发测试通知（不抓取，仅验证推送配置）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # 允许提交历史快照回仓库

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 运行监控脚本
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TEST_EMAIL_ONLY: ${{ inputs.test_email == true && '1' || '0' }}
        run: |
          if [ "$TEST_EMAIL_ONLY" = "1" ]; then
            echo "=== 仅测试通知模式 ==="
            TEST_EMAIL=1 TEST_EMAIL_ONLY=1 python monitor.py
          else
            echo "=== 常规监控模式 ==="
            python monitor.py
          fi

      - name: 提交历史快照
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/history.json data/monitor.log data/alerts.jsonl 2>/dev/null || true
          git commit -m "chore: 更新监控历史快照 $(date -u +'%Y-%m-%d %H:%M:%S UTC')" 2>/dev/null || echo "无变更"
          git push 2>/dev/null || echo "推送失败（可能无变更或无权限）"
